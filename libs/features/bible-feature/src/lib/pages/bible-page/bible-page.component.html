<lyri-page-container>
  <ng-container page-header>
    <div class="page-header__input">
      <input pInputText placeholder="Поиск" class="page-header__search-input" [formControl]="searchControl" (click)="searchControl.value && searchOverlay.show($event)" />
      <p-overlayPanel #searchOverlay>

        @if (searchResult$ | async; as searchResultDto) {
          <ng-scrollbar externalViewport cdkVirtualScrollViewport style="width: 1000px; height: 250px">
            <cdk-virtual-scroll-viewport [appendOnly]="false" orientation="vertical" [itemSize]="48" minBufferPx="100"
                                         maxBufferPx="300" style="display: flex; height: 100%;">
              <span cdkListbox>
                <div *cdkVirtualFor="let item of searchResultDto.sections; let index; templateCacheSize: 10"
                     [cdkOption]="item"
                     style="min-height: 48px; display: flex; align-items: center; gap: 8px; margin: 4px 0; border-bottom: 1px solid white;"
                     (click)="onSelectSearchElement(item)"
                >
                  <div
                    style="max-width: 100px; width: 100px; display: inline-flex; align-items: center; color: dodgerblue; text-decoration: underline; cursor: pointer;" (click)="onSelectSearchElement(item)">
                    {{ item.bookShortName }}
                    {{ item.chapterId }}:{{ item.content.number }}</div>
                  <div style="width: 100%;"
                       [innerHTML]="item.content.text | highliter: searchControl.value ?? ''"></div>
                </div>

              </span>
            </cdk-virtual-scroll-viewport>

          </ng-scrollbar>


        }


      </p-overlayPanel>
    </div>
  </ng-container>
  <ng-container page-content [formGroup]="bibleFormGroup">
    <div class="list-search-wrapper">
      <div class="list-search-block">
        <p-dropdown
          [formControl]="bibleFormGroup.controls.translate"
          [options]="bibleTranslates"
          optionLabel="title"
          styleClass="list-search-dropdown"
        >
          <ng-template pTemplate="selectedItem" let-data>{{ data.title }}</ng-template>
        </p-dropdown>

        <lyri-list-box [items]="(bookList$ | async) || []"
                       [formControl]="bibleFormGroup.controls.book"
                       [tabIndex]="0"
        >
          <ng-template [pTemplate]="ListBoxTemplates.ITEM" let-data let-search="search">
            <div class="list-item__wrapper">
              <div class="list-item__number"
                   [ngClass]="{
                    'list-item__number--law': data.baseEntity.type === BibleBookType.Law,
                    'list-item__number--history': data.baseEntity.type === BibleBookType.History,
                    'list-item__number--poetry': data.baseEntity.type === BibleBookType.Poetry,
                    'list-item__number--major-prophet': data.baseEntity.type === BibleBookType.MajorProphet,
                    'list-item__number--minor-prophet': data.baseEntity.type === BibleBookType.MinorProphet,
                    'list-item__number--gospel': data.baseEntity.type === BibleBookType.Gospel,
                    'list-item__number--acts': data.baseEntity.type === BibleBookType.Acts,
                    'list-item__number--pauline-epistle': data.baseEntity.type === BibleBookType.PaulineEpistle,
                    'list-item__number--general-epistle': data.baseEntity.type === BibleBookType.GeneralEpistle,
                    'list-item__number--pastoral-epistle': data.baseEntity.type === BibleBookType.PastoralEpistle,
                    'list-item__number--apocalyptic': data.baseEntity.type === BibleBookType.Apocalyptic
                   }"
                   [innerHTML]="data.searchKey  | highliter: search"></div>
              <div class="list-item__title" [innerHTML]="data.title | highliter: search"></div>
            </div>
          </ng-template>
        </lyri-list-box>
      </div>
    </div>

    @if (bibleFormGroup.controls.book.valueChanges | async) {
      <div class="list-search-wrapper list-search-wrapper__chapters">
        <div class="list-search-block">
          <div class="list-search-block__header">
            Главы
          </div>

          <lyri-list-box [items]="(chapterList$ | async) || []" [formControl]="bibleFormGroup.controls.chapter"
                         [withSearch]="false" [tabIndex]="1">
            <ng-template [pTemplate]="ListBoxTemplates.ITEM" let-data let-search="search">
              <div class="list-item__wrapper">
                <div class="list-item__title" [innerHTML]="data.title | highliter: search"></div>
              </div>
            </ng-template>
          </lyri-list-box>
        </div>
      </div>



      @if ((sectionList$ | async); as sections) {
        <lyri-bible-chapter [sections]="sections" [tabIndex]="2" (startCasting)="onStartCasting()"></lyri-bible-chapter>
      }
    }

  </ng-container>
  <ng-container page-sideibar-preview>
    <lyri-bible-casting-page></lyri-bible-casting-page>
  </ng-container>
  <ng-container page-sideibar-content>
    <button pButton (click)="onStartCasting()">транслировать</button>
    <!--    <button pButton severity="info" (click)="onStartCasting()">Начать с выбранного слайда</button>-->
    <div class="flex">

      <button pButton severity="danger" [disabled]="castingIsPaused$ | async" (click)="onPauseCasting()">Остановить
      </button>
      <button pButton severity="danger" [disabled]="windowHasClose$ | async" (click)="onStopCasting()">Закрыть</button>
    </div>

    <div class="flex">
      <!--      <button pButton severity="help" (click)="onNavigateSlide('prev')">Назад</button>-->
      <!--      <button pButton severity="help" (click)="onNavigateSlide('next')">В перед</button>-->
    </div>
  </ng-container>
</lyri-page-container>
