<div class="control-sidebar__wrapper">
  <lyri-bible-casting-preview class="control-sidebar__preview"></lyri-bible-casting-preview>

  <div class="control-sidebar__actions">
    @if (castingIsPaused$ | async) {
      <p-splitButton
        label="Транслировать"
        icon="pi pi-play"
        (onClick)="onStartCasting()"
        [disabled]="isOpeningWindow | async"
        [model]="(closeMenuItems$ | async) || []"
        severity="success"
        tourAnchor="bible:cast-start"
        styleClass="w-full"
      ></p-splitButton>
    } @else {
      <p-splitButton
        label="Остановить"
        icon="pi pi-stop"
        (onClick)="onPauseCasting()"
        [disabled]="isOpeningWindow | async"
        [model]="(closeMenuItems$ | async) || []"
        severity="danger"
        tourAnchor="bible:cast-stop"
        styleClass="w-full"
      ></p-splitButton>
    }
  </div>

  <lyri-navigator-feature class="control-sidebar__navigator" feature="bible">
    <lyri-casting-appearance-controls navigator-appearance />
  </lyri-navigator-feature>
</div>
