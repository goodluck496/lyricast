<ng-scrollbar>
  <div class="song-container">
    @for (lyric of lyrics(); track lyric.uniqId) {
      <div class="lyric-item">
        <div class="lyric-item__header">{{ lyric.sectionTitle }}</div>
        <div class="lyric-item__content">
          @for (line of lyric.lines; track line.rangeIndex) {
            <div class="lyric-item__line"
                 #lyricItem
                 [class.lyric-item__line--selected]="selectedLyricLine()?.rangeIndex === line.rangeIndex
                 && lyric.uniqId === selectedLyric()?.uniqId"
                 [innerHTML]="sanitizer.bypassSecurityTrustHtml(line.text)"
                 lyriDblClick
                 (dblClick)="onLineClick(lyric, line, true)"
                 (click)="onLineClick(lyric, line)"
            ></div>
<!--            <p-editor [(ngModel)]="line.text" (keydown)="$event.stopPropagation()" (onTextChange)="onTextChange($event)"></p-editor>-->
          }
        </div>
      </div>
    }
  </div>

</ng-scrollbar>
