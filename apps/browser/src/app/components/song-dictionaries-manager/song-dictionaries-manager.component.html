<p-accordion [multiple]="false">
  <p-accordion-panel value="songs">
    <p-accordion-header>
      <div class="song-dicts__accordion-header">
        <span>{{ title }}</span>
        <div class="song-dicts__accordion-actions">
          <button
            pButton
            severity="secondary"
            [disabled]="songDictionariesLoading"
            (click)="onReloadSongDictionaries($event)"
          >
            @if (songDictionariesLoading) {
              <p-progress-spinner
                strokeWidth="5"
                [style]="{ width: '20px', height: '20px' }"
              ></p-progress-spinner>
            } @else {
              <span pButtonIcon class="pi pi-refresh"></span>
              <span pButtonLabel>Обновить</span>
            }
          </button>

          <button
            pButton
            severity="danger"
            [loading]="songDictionariesClearBusy"
            [disabled]="songDictionariesLoading || songDictionariesClearBusy"
            (click)="onClearSongDictionaries($event)"
          >
            <span pButtonLabel>Очистить</span>
          </button>
        </div>
      </div>
    </p-accordion-header>
    <p-accordion-content>
      @if (songDictionariesLoading) {
        <div class="song-dicts__loading">
          <p-progressSpinner></p-progressSpinner>
        </div>
      } @else {
        <div class="song-dicts__grid">
          @for (card of songDictionaries; track card.fileKey) {
            <div
              class="song-dicts__card"
              [class.song-dicts__card--missing]="!card.isInstalled"
            >
              <lyri-song-dictionary-card [db]="toSongDatabaseInfo(card)" [size]="'sm'">
                <div cardActions class="song-dicts__actions">
                  @if (card.needsUpdate) {
                    <button
                      pButton
                      class="song-dicts__badge"
                      severity="warn"
                      (click)="onInstallOrUpdateDictionary($event, card)"
                    >
                      <span pButtonIcon class="pi pi-refresh"></span>
                    </button>
                  }

                  @if (card.isInstalled) {
                    <button
                      pButton
                      class="song-dicts__badge"
                      severity="danger"
                      (click)="onDeleteDictionary($event, card)"
                    >
                      <span pButtonIcon class="pi pi-trash"></span>
                    </button>
                  }

                  @if (!card.isInstalled) {
                    <button
                      pButton
                      severity="primary"
                      (click)="onInstallOrUpdateDictionary($event, card)"
                    >
                      <span pButtonIcon class="pi pi-plus"></span>
                    </button>
                  }
                </div>
              </lyri-song-dictionary-card>

              @if (songDictionaryBusyByKey[card.fileKey]) {
                <div class="song-dicts__overlay">
                  <p-progressSpinner></p-progressSpinner>
                </div>
              }
            </div>
          }
        </div>
      }
    </p-accordion-content>
  </p-accordion-panel>
</p-accordion>

<p-confirmpopup>
  <ng-template #content let-data>
    @if (data) {
      <div [innerHTML]="data.message"></div>
    }
  </ng-template>
</p-confirmpopup>
