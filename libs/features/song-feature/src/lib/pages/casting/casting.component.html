<div class="info-block" [class.hide]="!showingContent()">
  <div class="info-block__type" [class.hide]="!selectedSong()">{{ selectedLyric()?.sectionTitle }}</div>
  <div class="info-block__number" [class.hide]="!selectedSong()">{{ selectedSong()?.number }}</div>
</div>

<div class="slides__container" [class.hide]="hideContent">
  <div class="reveal">
    <div class="slides">
      <section class="stack">
        <section
          class="slides__section">
          <div [fittext]="true"
               [maxFontSize]="120"
               [activateOnResize]="true">
            <div class="slides__content"></div>
          </div>

        </section>
        @for (lyric of selectedLyrics(); track lyric.uniqId) {

          @for (line of lyric.lines; track line.rangeIndex) {
            @if (showingContent()) {
              <section
                [class.hide]="hideContent"
                class="slides__section">
                <div [fittext]="true"
                     [maxFontSize]="120"
                     [activateOnResize]="true">
                  <div
                    [innerHTML]="sanitizer.bypassSecurityTrustHtml(line.text)"
                    class="slides__content"></div>
                </div>

              </section>
            }
          }
        }
      </section>

    </div>
  </div>
</div>
