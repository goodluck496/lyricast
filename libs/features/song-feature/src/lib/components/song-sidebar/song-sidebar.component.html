<div class="control-sidebar__wrapper">
  <!-- Header with preview switcher tabs & live indicators -->
  <div class="sidebar-header-bar">
    <div class="sidebar-preview-tabs">
      <button
        type="button"
        class="sidebar-preview-tab"
        [class.sidebar-preview-tab--active]="activePreviewTab === 'main'"
        (click)="activePreviewTab = 'main'"
      >
        <span class="live-dot" [class.live-dot--active]="isLive$ | async"></span>
        <i class="pi pi-desktop"></i>
        <span>Зал</span>
      </button>
      <button
        type="button"
        class="sidebar-preview-tab"
        [class.sidebar-preview-tab--active]="activePreviewTab === 'stage'"
        (click)="activePreviewTab = 'stage'"
      >
        <span class="live-dot" [class.live-dot--active]="isLive$ | async"></span>
        <i class="pi pi-eye"></i>
        <span>Сцена</span>
      </button>
    </div>
    @if (hasObsChannel$ | async) {
      <div
        class="sidebar-obs-chip"
        [class.sidebar-obs-chip--live]="isLive$ | async"
        title="OBS Browser Source активен"
      >
        <span class="live-dot" [class.live-dot--active]="isLive$ | async"></span>
        <span>OBS</span>
      </div>
    }
    @if (hasNdiChannel$ | async) {
      <div
        class="sidebar-obs-chip sidebar-ndi-chip"
        [class.sidebar-ndi-chip--live]="isLive$ | async"
        title="NDI Network Broadcast активен"
      >
        <span class="live-dot" [class.live-dot--active]="isLive$ | async"></span>
        <span>NDI</span>
      </div>
    }
  </div>

  <!-- Unified, fixed-size preview container -->
  <div class="sidebar-preview-frame">
    <!-- Snowflake Freeze overlay in bottom-left -->
    <button
      type="button"
      class="sidebar-freeze-btn"
      [class.sidebar-freeze-btn--active]="castingIsFrozen$ | async"
      [disabled]="(openedCastingWindow$ | async) === false"
      (click)="onToggleFreeze()"
      [pTooltip]="(castingIsFrozen$ | async) ? 'Экран заморожен (Freeze). Нажмите, чтобы разморозить' : 'Заморозить экран (Freeze): удерживает текущий слайд для зала, пока вы переключаете песни'"
      tooltipPosition="top"
    >
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="2" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        <line x1="19.07" y1="4.93" x2="4.93" y2="19.07"></line>
        <polyline points="9 3 12 6 15 3"></polyline>
        <polyline points="9 21 12 18 15 21"></polyline>
        <polyline points="3 9 6 12 3 15"></polyline>
        <polyline points="21 9 18 12 21 15"></polyline>
      </svg>
      @if (castingIsFrozen$ | async) {
        <span class="freeze-label">FREEZE</span>
      }
    </button>

    @if (activePreviewTab === 'main') {
      <lyri-song-casting-preview class="preview-content-fill" />
    } @else {
      <div class="sidebar-stage-preview preview-content-fill">
        <div class="sidebar-stage-preview__header">
          <span class="stage-tag"><i class="pi pi-desktop"></i> СЦЕНА</span>
          <span class="stage-clock">{{ clockTime() }}</span>
        </div>
        <div class="sidebar-stage-preview__body">
          <div
            class="stage-current-line"
            [innerHTML]="currentLyricText() || '— Нет текста —'"
          ></div>
        </div>
        <div class="sidebar-stage-preview__footer">
          <span class="next-label">СЛЕДУЮЩИЙ:</span>
          <span class="next-text" [innerHTML]="nextLyricText() || '—'"></span>
        </div>
      </div>
    }
  </div>

  <!-- Compact single action row: play button + blackout eye icon button -->
  <div class="control-sidebar__actions">
    <div class="sidebar-action-row">
      @if (castingIsPaused$ | async) {
        <p-splitButton
          label="Транслировать"
          icon="pi pi-play"
          (onClick)="onStartCasting(true)"
          [disabled]="isOpeningWindow | async"
          [model]="(closeMenuItems$ | async) || []"
          severity="success"
          tourAnchor="songs:cast-start"
          styleClass="flex-1 p-button-sm"
        ></p-splitButton>
      } @else {
        <p-splitButton
          label="Остановить"
          icon="pi pi-stop"
          (onClick)="onPauseCasting()"
          [disabled]="isOpeningWindow | async"
          [model]="(closeMenuItems$ | async) || []"
          severity="danger"
          tourAnchor="songs:cast-stop"
          styleClass="flex-1 p-button-sm"
        ></p-splitButton>
      }

      <!-- Blackout All icon button -->
      <button
        type="button"
        class="sidebar-blackout-btn"
        [class.sidebar-blackout-btn--active]="isBlackoutAll"
        [disabled]="(openedCastingWindow$ | async) === false"
        (click)="onBlackoutAllToggle(!isBlackoutAll)"
        [title]="isBlackoutAll ? 'Все экраны затемнены (клик для включения)' : 'Затемнить все экраны (Blackout All)'"
      >
        <i [class]="isBlackoutAll ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
      </button>
    </div>
  </div>

  <lyri-navigator-feature class="control-sidebar__navigator" feature="songs">
    <lyri-casting-appearance-controls navigator-appearance>
      <div class="song-sidebar__fit-text-toggle" casting-appearance-font-extra>
        <label for="songFitTextAutoWrap">Автоперенос для fit-text</label>
        <p-toggleswitch
          inputId="songFitTextAutoWrap"
          [ngModel]="textLayout.fitTextAutoWrapEnabled()"
          (ngModelChange)="onFitTextAutoWrapToggle($event)"
        />
      </div>
    </lyri-casting-appearance-controls>
  </lyri-navigator-feature>
</div>
