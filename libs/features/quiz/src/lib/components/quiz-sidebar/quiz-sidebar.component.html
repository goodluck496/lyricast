<div class="quiz-sidebar" *ngIf="!isLoading">
      <h4>Управление викториной</h4>
      <div class="quiz-sidebar__quiz-select">
        <label>Викторина</label>
        <p-autoComplete
          [suggestions]="filteredQuizzes"
          optionLabel="title"
          (completeMethod)="filterQuizzes($event)"
          [dropdown]="true"
          [forceSelection]="false"
          [(ngModel)]="selectedQuiz"
          (onSelect)="onQuizSelected($event.value)"
          placeholder="Выберите викторину"
        ></p-autoComplete>
      </div>
      <div class="quiz-sidebar__quiz-actions">
        <input
          pInputText
          type="text"
          [(ngModel)]="newQuizTitle"
          placeholder="Название новой викторины"
        />
        <button
          pButton
          type="button"
          class="quiz-sidebar__button"
          (click)="createQuiz()"
        >
          Создать викторину
        </button>
        <button
          pButton
          type="button"
          class="quiz-sidebar__button"
          severity="danger"
          [disabled]="!selectedQuiz"
          (click)="confirmDeleteQuiz($event)"
        >
          Удалить викторину
        </button>
      </div>
      <div class="quiz-sidebar__team-select">
        <label>Команда для текущего вопроса</label>
        <p-select
          [options]="teams"
          optionLabel="name"
          optionValue="id"
          [showClear]="true"
          placeholder="— не выбрано —"
          [(ngModel)]="selectedTeamId"
        ></p-select>
      </div>
      <button pButton type="button" class="quiz-sidebar__button" [disabled]="isCastingActive" (click)="startQuizCasting()">
        Начать викторину
      </button>
      <button pButton type="button" class="quiz-sidebar__button" (click)="stopQuizCasting()">
        Сбросить экран
      </button>
      <button pButton type="button" severity="danger" class="quiz-sidebar__button" [disabled]="!isCastingActive" (click)="closeCastingWindow()">
        Закрыть окно
      </button>

      <div class="quiz-sidebar__answers">
        <h5>Оценка ответа</h5>
        <button
          pButton
          type="button"
          class="quiz-sidebar__button quiz-sidebar__button--correct"
          severity="success"
          [disabled]="!canAnswer"
          (click)="answerCorrect()"
        >
          Верно
        </button>
        <button
          pButton
          type="button"
          class="quiz-sidebar__button quiz-sidebar__button--wrong"
          severity="danger"
          [disabled]="!canAnswer"
          (click)="answerWrong()"
        >
          Неверно
        </button>
      </div>

      <button
        pButton
        type="button"
        class="quiz-sidebar__button"
        severity="info"
        (click)="showStatsOnCasting()"
      >
        Показать статистику
      </button>

      <button
        pButton
        type="button"
        class="quiz-sidebar__button"
        (click)="resetStatistics()"
      >
        Сбросить статистику
      </button>

      <button pButton type="button" severity="help" (click)="saveState()">
        Сохранить викторину
      </button>
      <button pButton type="button" severity="info" (click)="reloadState()">
        Загрузить из файла
      </button>
    </div>
