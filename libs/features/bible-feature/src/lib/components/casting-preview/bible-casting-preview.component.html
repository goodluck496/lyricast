<div class="preview-surface" [ngStyle]="appearanceService.getBackgroundStyles(appearance())">
  <div class="preview-header">
    @if (selectedBibleVerseForCast(); as data) {
      <div>
        {{ data.bookTitle.full }}
        {{ data.chapterId }}:
        @if (selectedRange(); as range) {
          @if (range.from === range.to) {
            {{ range.from }}
          } @else {
            {{ range.from }}-{{ range.to }}
          }
        } @else {
          {{ data.number }}
        }
      </div>
    }

  </div>
  <div class="preview-deck">
    <div class="reveal">
      <div class="slides">
        <section>
          <div
            [fittext]="true"
            [maxFontSize]="21"
            [minFontSize]="8"
            [activateOnInputEvents]="true"
            [activateOnResize]="true"
          >
            <div
              [innerHTML]="slideText"
              [ngStyle]="appearanceService.getTextStyles(appearance())"
              class="slide-content"></div>
          </div>

        </section>
      </div>
    </div>
  </div>
</div>
