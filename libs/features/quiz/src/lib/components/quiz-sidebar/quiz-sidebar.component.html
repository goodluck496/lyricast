<div class="quiz-sidebar">
  <p-progressSpinner
    *ngIf="isLoading"
    styleClass="quiz-sidebar__spinner"
    strokeWidth="4"
  ></p-progressSpinner>

  <ng-container *ngIf="!isLoading">
    <!-- Блок: выбор и управление викториной -->
    <section class="quiz-sidebar__section">
      <!-- <h5 class="quiz-sidebar__section-title">Викторина</h5> -->
      <div class="quiz-sidebar__field">
        <!-- <label>Викторина</label> -->
        <p-autoComplete
          [suggestions]="filteredQuizzes"
          optionLabel="title"
          (completeMethod)="filterQuizzes($event)"
          [dropdown]="true"
          [forceSelection]="false"
          [(ngModel)]="selectedQuiz"
          (onSelect)="onQuizSelected($event.value)"
          placeholder="Выберите викторину"
        ></p-autoComplete>
      </div>
      <div
        class="quiz-sidebar__field quiz-sidebar__field--inline"
        *ngIf="!selectOnly"
      >
        <input
          pInputText
          type="text"
          [(ngModel)]="newQuizTitle"
          placeholder="Название новой викторины"
        />
        <button
          pButton
          type="button"
          class="quiz-sidebar__button"
          (click)="createQuiz()"
        >
          Создать
        </button>
      </div>
      <div class="quiz-sidebar__buttons-row" *ngIf="!selectOnly">
        <button
          pButton
          type="button"
          class="quiz-sidebar__button"
          severity="danger"
          [disabled]="!selectedQuiz"
          (click)="confirmDeleteQuiz($event)"
        >
          Удалить викторину
        </button>
      </div>
    </section>

    <!-- Блок: текущая игра / пульт показа -->
    <section class="quiz-sidebar__section" *ngIf="!selectOnly">
      <h5 class="quiz-sidebar__section-title">Текущий вопрос</h5>
      <div class="quiz-sidebar__field">
        <label>Команда для текущего вопроса</label>
        <p-select
          [options]="teams"
          optionLabel="name"
          optionValue="id"
          [showClear]="true"
          placeholder="— не выбрано —"
          [(ngModel)]="selectedTeamId"
        ></p-select>
      </div>
      <div class="quiz-sidebar__buttons-row">
        <button
          pButton
          type="button"
          class="quiz-sidebar__button"
          [disabled]="isCastingActive || !selectedQuiz"
          (click)="startQuizCasting()"
        >
          Начать викторину
        </button>
        <button
          pButton
          type="button"
          class="quiz-sidebar__button"
          (click)="stopQuizCasting()"
        >
          Сбросить экран
        </button>
        <button
          pButton
          type="button"
          severity="danger"
          class="quiz-sidebar__button"
          [disabled]="!isCastingActive"
          (click)="closeCastingWindow()"
        >
          Закрыть окно
        </button>
      </div>
    </section>

    <!-- Блок: оценка ответа -->
    <section class="quiz-sidebar__section" *ngIf="!selectOnly">
      <h5 class="quiz-sidebar__section-title">Оценка ответа</h5>
      <div class="quiz-sidebar__buttons-row quiz-sidebar__buttons-row--compact">
        <button
          pButton
          type="button"
          class="quiz-sidebar__button quiz-sidebar__button--correct"
          severity="success"
          [disabled]="!canAnswer"
          (click)="answerCorrect()"
        >
          Верно
        </button>
        <button
          pButton
          type="button"
          class="quiz-sidebar__button quiz-sidebar__button--wrong"
          severity="danger"
          [disabled]="!canAnswer"
          (click)="answerWrong()"
        >
          Неверно
        </button>
      </div>
    </section>

    <!-- Блок: статистика и состояние -->
    <section class="quiz-sidebar__section" *ngIf="!selectOnly">
      <h5 class="quiz-sidebar__section-title">Статистика и файл</h5>
      <div class="quiz-sidebar__buttons-row">
        <button
          pButton
          type="button"
          class="quiz-sidebar__icon-button"
          icon="pi pi-chart-bar"
          pTooltip="Показать статистику"
          tooltipPosition="top"
          severity="info"
          [disabled]="!selectedQuiz"
          (click)="showStatsOnCasting()"
        ></button>
        <button
          pButton
          type="button"
          class="quiz-sidebar__icon-button"
          icon="pi pi-sync"
          pTooltip="Сбросить статистику"
          tooltipPosition="top"
          [disabled]="!selectedQuiz"
          (click)="resetStatistics()"
        ></button>
        <button
          pButton
          type="button"
          class="quiz-sidebar__icon-button quiz-sidebar__icon-button--primary"
          icon="pi pi-save"
          pTooltip="Сохранить викторину"
          tooltipPosition="top"
          severity="help"
          [disabled]="!selectedQuiz"
          (click)="saveState()"
        ></button>
      </div>
    </section>
  </ng-container>
</div>
