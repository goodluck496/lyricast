<lyri-page-container [pagePath]="[Pages.MAIN, Pages.SONGS_FEATURE, Pages.SONGS]">
  <ng-template [pTemplate]="PAGE_CONTAINER_TEMPLATES.PAGE_HEADER">
    <div class="page-header__lyric-count">
<!--      todo возможно стоит вынести в какую-то админку,
            а то если туда-сюда менять галку и вобще подвязываясь на этот флаг
            ломается история переходов, потому что каждый раз "налету" создаются
            новые припевы после куплетов
          <label for="chorusAfterCouplet">Повторять<br>припев</label>-->
<!--      <p-checkbox id="chorusAfterCouplet" inputId="chorusAfterCouplet" [binary]="true"-->
<!--                  [(ngModel)]="chorusAfterCouplet"></p-checkbox>-->
      <label for="lyric-count">Разделить <br>на блоки:</label>
      <p-dropdown id="lyric-count" inputId="lyric-count" [(ngModel)]="splitCount"
                  (onChange)="onSelectSplitValue($event.value)"
                  [options]="SplitPartsCountOptions"></p-dropdown>
    </div>
  </ng-template>

  <ng-container page-content>
    <div class="list-search-wrapper">
      <div class="list-search-block list-search-block--wide">
        <p-dropdown
          [formControl]="selectedBook"
          [options]="songBooksDict"
          appendTo="body"
          optionLabel="title"
          styleClass="list-search-dropdown"
        >
          <ng-template pTemplate="selectedItem" let-data>{{ data.title }}</ng-template>
        </p-dropdown>

        <lyri-list-box [items]="(songsList$ | async) || []" [formControl]="songControl" [tabIndex]="0"
                       [loading]="isLoading()">
          <ng-template [pTemplate]="ListBoxTemplates.ITEM" let-data let-search="search">
            <div class="list-item__wrapper">
              <div class="list-item__number" [innerHTML]="data.searchKey  | highliter: search"></div>
              <div class="list-item__title">
                <span class="list-item__title-content" [innerHTML]="data.title | highliter: search"></span>
              </div>
            </div>
          </ng-template>
        </lyri-list-box>
      </div>
    </div>

    @if (selectedSong$ | async; as song) {
      @if (song) {
        <lyri-song [song]="song" (selectLyricLine)="onSelectLyricLine($event)" [tabIndex]="1"></lyri-song>
      }

    }

  </ng-container>


  <ng-template [pTemplate]="PAGE_CONTAINER_TEMPLATES.PAGE_SIDEBAR">
    <lyri-song-sidebar></lyri-song-sidebar>
  </ng-template>

</lyri-page-container>
