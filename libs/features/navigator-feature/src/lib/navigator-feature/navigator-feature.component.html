<p-tabs
  [value]="activeTab()"
  (valueChange)="activeTab.set($event ?? 'history')"
  styleClass="navigator-tabs"
  class="navigator-tabs"
>
  <p-tablist>
    <p-tab value="appearance">Оформление</p-tab>
    <p-tab value="history">История</p-tab>
    <p-tab value="queue" [disabled]="true">Очередь</p-tab>
  </p-tablist>
  <p-tabpanels>
  <p-tabpanel value="appearance">
    <ng-scrollbar class="navigator-tabs__scroll" visibility="hover">
      <div class="navigator-tabs__content">
        <ng-content select="[navigator-appearance]"></ng-content>
      </div>
    </ng-scrollbar>
  </p-tabpanel>
  <p-tabpanel value="history" class="navigator-tab">
    <div class="navigator-tabs__content navigator-tabs__content--history">
      <lyri-navigator-history [feature]="feature()" tourAnchor="history"></lyri-navigator-history>
    </div>
  </p-tabpanel>
  <p-tabpanel value="queue">
  </p-tabpanel>
  </p-tabpanels>
</p-tabs>
