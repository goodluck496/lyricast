<lyri-page-container [pagePath]="[Pages.MAIN, Pages.SONGS_FEATURE, Pages.SONGS]">
  <ng-template [pTemplate]="PAGE_CONTAINER_TEMPLATES.PAGE_HEADER">
    <div class="page-header__lyric-count">
<!--      todo возможно стоит вынести в какую-то админку,
            а то если туда-сюда менять галку и вобще подвязываясь на этот флаг
            ломается история переходов, потому что каждый раз "налету" создаются
            новые припевы после куплетов
          <label for="chorusAfterCouplet">Повторять<br>припев</label>-->
<!--      <p-checkbox id="chorusAfterCouplet" inputId="chorusAfterCouplet" [binary]="true"-->
<!--                  [(ngModel)]="chorusAfterCouplet"></p-checkbox>-->
      <label for="lyric-count">Разделить <br>на блоки:</label>
      <p-select id="lyric-count" inputId="lyric-count" tourAnchor="songs:lyric-count" [ngModel]="splitCount()"
                  (onChange)="onSelectSplitValue($event.value)"
                  [options]="SplitPartsCountOptions"></p-select>
    </div>
  </ng-template>

  <ng-container page-content>
    <div class="list-search-wrapper">
      <div class="list-search-block list-search-block--wide">
        <div class="song-list-toolbar">
          <p-select
            [formControl]="selectedBook"
            [options]="songBooksDict"
            appendTo="body"
            optionLabel="title"
            styleClass="list-search-dropdown song-list-toolbar__book"
            tourAnchor="songs:dict"
          >
            <ng-template pTemplate="selectedItem" let-data>{{ data.title }}</ng-template>
          </p-select>

          <p-select
            [formControl]="songListMode"
            [options]="SongListModeOptions"
            appendTo="body"
            optionLabel="label"
            optionValue="value"
            styleClass="list-search-dropdown song-list-toolbar__mode"
          ></p-select>
        </div>

        <div class="song-list-host" tourAnchor="songs:song">
          <lyri-list-box [items]="(songsList$ | async) || []" [formControl]="songControl" [tabIndex]="0"
                       [loading]="isLoading()">
            <ng-template [pTemplate]="ListBoxTemplates.ITEM" let-data let-search="search">
              <div class="list-item__wrapper">
                <div class="list-item__number" [innerHTML]="data.searchKey  | highliter: search"></div>
                <div class="list-item__title">
                  <span class="list-item__title-content" [innerHTML]="data.title | highliter: search"></span>
                  @if (overriddenSongNumbers().has(data.baseEntity.number)) {
                    <span class="list-item__override-badge" pTooltip="Изменена локально" tooltipPosition="top">
                      <i class="pi pi-pencil"></i>
                    </span>
                  }
                  @if (data.usageSummary) {
                    <span
                      class="list-item__usage"
                      [pTooltip]="getUsageTooltip(data)"
                      tooltipPosition="right"
                    >{{ getUsageDate(data) }}</span>
                  }
                </div>
              </div>
            </ng-template>
          </lyri-list-box>
        </div>
      </div>
    </div>

    @if (selectedSong$ | async; as song) {
      @if (song) {
        <div class="song-view-container">
          @if (hasOverride()) {
            <div class="song-override-banner">
              <div class="song-override-banner__info">
                <i class="pi pi-pencil song-override-banner__icon"></i>
                <span class="song-override-banner__badge">Изменена локально</span>
              </div>
              <p-button
                label="Сбросить к оригиналу из справочника"
                icon="pi pi-refresh"
                [text]="true"
                severity="warn"
                size="small"
                (onClick)="onResetSongOverride(song)"
              ></p-button>
            </div>
          }
          <lyri-song [song]="song" (songUpdated)="onSongUpdated($event)" (selectLyricLine)="onSelectLyricLine($event)" [tabIndex]="1"></lyri-song>
        </div>
      }
    }

  </ng-container>


  <ng-template [pTemplate]="PAGE_CONTAINER_TEMPLATES.PAGE_SIDEBAR">
    <lyri-song-sidebar></lyri-song-sidebar>
  </ng-template>

</lyri-page-container>
