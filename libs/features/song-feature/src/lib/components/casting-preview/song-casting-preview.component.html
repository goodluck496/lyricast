<div class="preview-surface" [ngStyle]="appearanceService.getBackgroundStyles(appearance())">
  <div class="preview-header">
    <div>{{ selectedLyric()?.sectionTitle }}</div>
    <div>{{ selectedLyric()?.songId }}</div>
  </div>
  <div class="preview-deck">
    <div class="reveal">
      <div class="slides">
        <section>
          <div
            [fittext]="true"
            [maxFontSize]="25"
            [minFontSize]="8"
            [activateOnResize]="true"
          >
            <div
              [innerHTML]="sanitizer.bypassSecurityTrustHtml(slideText)"
              [ngStyle]="appearanceService.getTextStyles(appearance())"
              class="slide-content"></div>
          </div>

        </section>
      </div>
    </div>
  </div>
</div>
