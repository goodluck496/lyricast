<div class="control-sidebar__wrapper">
  <p-tabs class="free-slide-sidebar__tabs" [value]="0">
    <p-tablist>
      <p-tab [value]="0">Управление</p-tab>
      <p-tab [value]="1">Эффекты переходов</p-tab>
    </p-tablist>
    <p-tabpanels class="free-slide-sidebar__tabpanels">
      <p-tabpanel [value]="0">
        <div class="free-slide-sidebar__panel-content">
          <lyri-free-slide-casting-preview class="control-sidebar__preview"></lyri-free-slide-casting-preview>

          <div class="control-sidebar__actions">
            @if ((castingIsPaused$ | async)) {
              <p-splitButton
                label="Транслировать"
                icon="pi pi-play"
                (onClick)="onStartCasting()"
                [model]="(closeMenuItems$ | async) || []"
                severity="success"
                styleClass="w-full"
              ></p-splitButton>
            } @else {
              <p-splitButton
                label="Остановить"
                icon="pi pi-stop"
                (onClick)="onPauseCasting()"
                [model]="(closeMenuItems$ | async) || []"
                severity="danger"
                styleClass="w-full"
              ></p-splitButton>
            }

            <div class="free-slide-sidebar__switches">
              <div class="free-slide-sidebar__switch-row">
                <label class="free-slide-sidebar__switch-label" for="free-slide-live-sync">
                  <i class="pi pi-sync"></i>
                  <span>LiveSync</span>
                </label>
                <p-toggleswitch
                  inputId="free-slide-live-sync"
                  [ngModel]="liveSyncEnabled$ | async"
                  (ngModelChange)="onLiveSyncToggle($event)"
                ></p-toggleswitch>
              </div>

              <div class="free-slide-sidebar__switch-row">
                <label class="free-slide-sidebar__switch-label" for="free-slide-freeze">
                  <i class="pi pi-pause-circle"></i>
                  <span>Freeze</span>
                </label>
                <p-toggleswitch
                  inputId="free-slide-freeze"
                  [disabled]="(openedCastingWindow$ | async) === false"
                  [ngModel]="castingIsFrozen$ | async"
                  (ngModelChange)="onFreezeToggle($event)"
                ></p-toggleswitch>
              </div>
            </div>
          </div>

          <lyri-navigator-feature class="control-sidebar__navigator" feature="free-slide" />

          <div class="control-sidebar__divider"></div>
        </div>
      </p-tabpanel>

      <!-- Вкладка Эффекты переходов -->
      <p-tabpanel [value]="1">
        <div class="free-slide-sidebar__panel-content">
          <lyri-slide-transition-editor></lyri-slide-transition-editor>
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
