<div class="control-sidebar__wrapper">
  <lyri-bible-casting-preview class="control-sidebar__preview"></lyri-bible-casting-preview>

  <div class="control-sidebar__actions">

    @if ((castingIsPaused$ | async)) {
      <button pButton class="flex flex-w-center flex-h-center" (click)="onStartCasting()" severity="success" tourAnchor="bible:cast-start">
        <lyri-icon name="play" style="width: 14px; height: 14px"></lyri-icon>
        Транслировать
      </button>
    } @else {
      <button pButton class="flex flex-w-center flex-h-center" (click)="onPauseCasting()" severity="danger" tourAnchor="bible:cast-stop">
        <lyri-icon name="stop" style="width: 14px; height: 14px"></lyri-icon>
        Остановить
      </button>
    }

    <div class="flex">
      <button
        pButton
        severity="danger"
        [disabled]="(openedCastingWindow$ | async) === false"
        (click)="onCloseCasting()"
      >
        Закрыть
      </button>
    </div>
  </div>

  <lyri-navigator-feature class="control-sidebar__navigator" feature="bible" />
</div>
