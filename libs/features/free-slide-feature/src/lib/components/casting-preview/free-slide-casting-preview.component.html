<div style="width: 100%; height: 260px;" class="ql-editor">
  <div class="reveal">
    <div class="slides">
      <section class="ql-container">
        <div [fittext]="true"
             [maxFontSize]="30"
             [activateOnInputEvents]="true"
             [activateOnResize]="true">
          <div [innerHTML]="slideText" class="slide-content"></div>
        </div>

      </section>
    </div>
  </div>
</div>
