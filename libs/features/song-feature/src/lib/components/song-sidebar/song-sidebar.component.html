<div class="control-sidebar__wrapper">
  <!-- Preview switcher tabs -->
  <div class="sidebar-preview-tabs">
    <button
      type="button"
      class="sidebar-preview-tab"
      [class.sidebar-preview-tab--active]="activePreviewTab === 'main'"
      (click)="activePreviewTab = 'main'"
    >
      <i class="pi pi-desktop"></i>
      <span>Зал</span>
    </button>
    <button
      type="button"
      class="sidebar-preview-tab"
      [class.sidebar-preview-tab--active]="activePreviewTab === 'stage'"
      (click)="activePreviewTab = 'stage'"
    >
      <i class="pi pi-eye"></i>
      <span>Сцена (Суфлер)</span>
    </button>
  </div>

  @if (activePreviewTab === 'main') {
    <lyri-song-casting-preview class="control-sidebar__preview" />
  } @else {
    <div class="sidebar-stage-preview control-sidebar__preview">
      <div class="sidebar-stage-preview__header">
        <span class="stage-tag"><i class="pi pi-desktop"></i> СЦЕНА</span>
        <span class="stage-clock">{{ clockTime() }}</span>
      </div>
      <div class="sidebar-stage-preview__body">
        <div
          class="stage-current-line"
          [innerHTML]="currentLyricText() || '— Нет текста —'"
        ></div>
      </div>
      <div class="sidebar-stage-preview__footer">
        <span class="next-label">СЛЕДУЮЩИЙ:</span>
        <span class="next-text" [innerHTML]="nextLyricText() || '—'"></span>
      </div>
    </div>
  }

  <!-- Active Screen Indicators -->
  <div class="sidebar-channels-bar">
    <div class="sidebar-channels-bar__label">
      <span>Экраны трансляции:</span>
      <span class="sidebar-channels-bar__count">{{ (activeChannels$ | async)?.length || 0 }}</span>
    </div>
    <div class="sidebar-channels-bar__chips">
      @for (ch of activeChannels$ | async; track ch.id) {
        <div
          class="sidebar-channel-chip"
          [class.sidebar-channel-chip--live]="!(castingIsPaused$ | async) && (openedCastingWindow$ | async)"
          [title]="ch.name + ' (' + ch.role + ')'"
        >
          <span class="status-dot"></span>
          <span class="chip-name">{{ ch.name }}</span>
        </div>
      }
    </div>
  </div>

  <div class="control-sidebar__actions relative">
    @if (castingIsPaused$ | async) {
      <p-splitButton
        label="Транслировать"
        icon="pi pi-play"
        (onClick)="onStartCasting(true)"
        [disabled]="isOpeningWindow | async"
        [model]="(closeMenuItems$ | async) || []"
        severity="success"
        tourAnchor="songs:cast-start"
        styleClass="w-full"
      ></p-splitButton>
    } @else {
      <p-splitButton
        label="Остановить"
        icon="pi pi-stop"
        (onClick)="onPauseCasting()"
        [disabled]="isOpeningWindow | async"
        [model]="(closeMenuItems$ | async) || []"
        severity="danger"
        tourAnchor="songs:cast-stop"
        styleClass="w-full"
      ></p-splitButton>
    }
    <div class="song-sidebar__switch-row">
      <label class="song-sidebar__switch-label" for="song-freeze">
        <i class="pi pi-pause-circle"></i>
        <span>Freeze</span>
      </label>
      <p-toggleswitch
        inputId="song-freeze"
        [disabled]="(openedCastingWindow$ | async) === false"
        [ngModel]="castingIsFrozen$ | async"
        (ngModelChange)="onFreezeToggle($event)"
      />
    </div>
    <div class="song-sidebar__switch-row">
      <label class="song-sidebar__switch-label" for="song-blackout">
        <i class="pi pi-eye-slash"></i>
        <span>Blackout All</span>
      </label>
      <p-toggleswitch
        inputId="song-blackout"
        [disabled]="(openedCastingWindow$ | async) === false"
        [ngModel]="isBlackoutAll"
        (ngModelChange)="onBlackoutAllToggle($event)"
      />
    </div>
  </div>

  <lyri-navigator-feature class="control-sidebar__navigator" feature="songs">
    <lyri-casting-appearance-controls navigator-appearance>
      <div class="song-sidebar__fit-text-toggle" casting-appearance-font-extra>
        <label for="songFitTextAutoWrap">Автоперенос для fit-text</label>
        <p-toggleswitch
          inputId="songFitTextAutoWrap"
          [ngModel]="textLayout.fitTextAutoWrapEnabled()"
          (ngModelChange)="onFitTextAutoWrapToggle($event)"
        />
      </div>
    </lyri-casting-appearance-controls>
  </lyri-navigator-feature>
</div>
