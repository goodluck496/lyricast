<div class="info-block" [class.hide]="!showingContent()">
  <div class="info-block__type" [class.hide]="!selectedBook()">{{ selectedBook()?.title?.short }}
    - {{ selectedChapter()?.number }}:{{ selectedVerseId() }}
  </div>
</div>

<div class="slides__container" [class.hide]="!showingContent()">
  <div class="reveal">
    <div class="slides">
      <section class="stack">
        <section
          class="slides__section">
          <div [fittext]="true"
               [maxFontSize]="120"
               [activateOnResize]="true">
            <div class="slides__content"></div>
          </div>

        </section>
        @for (content of selectedContents(); track content.number) {
          @for (line of content.text; track line) {
            @if (showingContent()) {
              <section
                class="slides__section">
                <div [fittext]="true"
                     [maxFontSize]="120"
                     [activateOnResize]="true">
                  <div
                    [innerHTML]="line"
                    class="slides__content"></div>
                </div>

              </section>
            }
          }
        }
      </section>

    </div>
  </div>
</div>
