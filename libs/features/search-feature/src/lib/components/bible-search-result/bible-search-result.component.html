<!--@if (!$isLoading())-->

@if (searchResult$ | async; as searchResultDto) {
  @if (searchResultDto.sections.length) {

    <ng-scrollbar externalViewport cdkVirtualScrollViewport class="bible-search-result__scroll-container">
      <cdk-virtual-scroll-viewport [appendOnly]="false"
                                   orientation="vertical"
                                   [itemSize]="64"

                                   class="bible-search-result__viewport">
                      <span cdkListbox>
                        <div *cdkVirtualFor="let item of searchResultDto.sections; let index; templateCacheSize: 5"
                             [cdkOption]="item"
                             class="bible-search-result__item"
                             (dblclick)="onSelectSearchElement(item)"
                        >
                          <!-- TODO заменить на компоненты ссылки-->
                          <div class="bible-search-result__link" (click)="onSelectSearchElement(item)">
                            {{ item.bookShortName }}
                            {{ item.chapterId }}:{{ item.content.number }}
                          </div>
                          <div class="bible-search-result__item-text"
                               [innerHTML]="item.content.text | highliter: searchResultDto.search ?? ''"></div>
                        </div>

                      </span>
      </cdk-virtual-scroll-viewport>

    </ng-scrollbar>

  } @else {
    Ничего не нет
  }


}
@if (isLoading()) {
  <p-progressBar mode="indeterminate" [style]="{ height: '6px' }" />
}
