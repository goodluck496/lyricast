
{{dictListControl.value | json}}
<div class="list-search-header">
  <p-dropdown
    [formControl]="dictListControl"
    [editable]="true"
    [options]="dictListItems()"
    optionLabel="label"
    optionValue="value"
  >
<!--    <ng-template pTemplate="selectedItem" let-data>3r784wiufesk</ng-template>-->
  </p-dropdown>

</div>
<div class="list-search-content">
  @for (item of $itemList(); track item.searchKey) {
    <div class="list-search-item" (click)="onChangeItem(item)">
      @if (templatesMap['item']; as template) {
        <ng-template pTemplate="item" [ngTemplateOutlet]="template"
                     [ngTemplateOutletContext]="{$implicit: item}" />
      } @else {
        {{ item.title }}
      }

    </div>
  }
</div>
