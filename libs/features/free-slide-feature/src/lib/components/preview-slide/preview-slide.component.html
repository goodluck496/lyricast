<div class="preview-slide__index">
  {{ slide().index + 1 }}
</div>
<div class="preview-slide__content ql-editor">
  <div style="width: 100%; height: 100%; " class="ql-container">
      <div [fittext]="true"
           [maxFontSize]="8"
           [activateOnInputEvents]="true"
           [activateOnResize]="true">
        <div [innerHTML]="slide().htmlString" class="slide-content"></div>
    </div>
  </div>

</div>
