<div class="control-sidebar__wrapper">
  <lyri-bible-casting-preview class="control-sidebar__preview"></lyri-bible-casting-preview>

  <div class="control-sidebar__actions">
    @if (castingIsPaused$ | async) {
      <p-splitbutton
        label="Транслировать"
        icon="pi pi-play"
        (onClick)="onStartCasting()"
        [disabled]="isOpeningWindow | async"
        [model]="(closeMenuItems$ | async) || []"
        severity="success"
        tourAnchor="bible:cast-start"
        styleClass="w-full"
      ></p-splitbutton>
    } @else {
      <p-splitbutton
        label="Остановить"
        icon="pi pi-stop"
        (onClick)="onPauseCasting()"
        [disabled]="isOpeningWindow | async"
        [model]="(closeMenuItems$ | async) || []"
        severity="danger"
        tourAnchor="bible:cast-stop"
        styleClass="w-full"
      ></p-splitbutton>
    }
  </div>

  @if (secondarySettings$ | async; as secondarySettings) {
    <div class="control-sidebar__secondary-translation">
      <div class="control-sidebar__secondary-header">
        <span>Доп. перевод</span>
        <p-toggleswitch
          [ngModel]="secondarySettings.enabled"
          (ngModelChange)="onSecondaryEnabledChange($event)"
        ></p-toggleswitch>
      </div>

      @if (secondarySettings.enabled) {
        <div class="control-sidebar__secondary-field">
          <p-select
            [ngModel]="secondarySettings.translate"
            (ngModelChange)="onSecondaryTranslateChange($event)"
            [options]="(secondaryTranslateOptions$ | async) || []"
            optionLabel="label"
            optionValue="value"
            placeholder="Выберите перевод"
            appendTo="body"
            styleClass="w-full"
          ></p-select>
        </div>

        <div class="control-sidebar__secondary-field">
          <p-select
            [ngModel]="secondarySettings.layout"
            (ngModelChange)="onSecondaryLayoutChange($event)"
            [options]="layoutOptions"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            styleClass="w-full"
          ></p-select>
        </div>

        <div class="control-sidebar__secondary-size">
          <span>Размер</span>
          <span>{{ secondarySettings.sizePercent }}%</span>
        </div>
        <mat-slider
          class="control-sidebar__secondary-slider"
          [min]="25"
          [max]="70"
          [step]="5"
        >
          <input
            matSliderThumb
            [value]="secondarySettings.sizePercent"
            (valueChange)="onSecondarySizeChange($event)"
          />
        </mat-slider>
      }
    </div>
  }

  <lyri-navigator-feature class="control-sidebar__navigator" feature="bible">
    <lyri-casting-appearance-controls navigator-appearance scope="bible" />
  </lyri-navigator-feature>
</div>
