<lyri-page-container [pagePath]="[Pages.MAIN, Pages.FREE_SLIDE_FEATURE, FreeSlidePages.MAIN]">
  <ng-template [pTemplate]="PAGE_CONTAINER_TEMPLATES.PAGE_HEADER">
    <h2>Free-Form Presentations</h2>
  </ng-template>

  <ng-container page-content>
    <div class="flex flex-column">
      <div class="flex flex-h-center">
        <button pButton pRipple (click)="onCreateNew()" severity="success">Новая презентация</button>
        <button pButton pRipple disabled>Создать из песни</button>
        <button pButton pRipple disabled>Создать из Книги</button>
      </div>
      <ng-scrollbar externalViewport cdkVirtualScrollViewport style="width: 100%; height: calc(100% - 100px);">
        <div class="flex flex-wrap">
          @if (presentations$ | async; as presentations) {

            @for (presentation of presentations; track presentation.id) {
              <div class="presentation-card"
                   [style.background-image]="presentation.previewUrl ? 'url(\'' + presentation.previewUrl + '\')' : null"
                   (click)="onSelect(presentation)"
              >
                <div class="card-overlay flex flex-column">
                  <h4>{{ presentation.title }}</h4>
                  <p>Слайдов: {{ presentation.slides.length }}</p>
                </div>
              </div>
            } @empty {
              <!-- Empty State -->
              <div class="empty-state">
                <h3>No presentations yet.</h3>
                <p>Get started by creating a new one.</p>
              </div>
            }


          }
        </div>

      </ng-scrollbar>
    </div>
  </ng-container>
  <ng-template [pTemplate]="PAGE_CONTAINER_TEMPLATES.PAGE_SIDEBAR">
    --
  </ng-template>


</lyri-page-container>
