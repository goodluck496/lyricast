<lyri-page-container>
  <ng-container page-header>
    <div class="page-header__input">
      <input pInputText placeholder="Поиск" [(ngModel)]="searchSig" (ngModelChange)="onSearch($event)" />
    </div>
    <div class="page-header__lyric-count">
      <label for="chorusAfterCouplet">Припев после куплета</label>
      <p-checkbox id="chorusAfterCouplet" inputId="chorusAfterCouplet" [binary]="true" [(ngModel)]="chorusAfterCouplet"></p-checkbox>
      <label for="lyric-count">Разделить припев<br />и куплет на блоки:</label>
      <p-dropdown id="lyric-count" inputId="lyric-count" [(ngModel)]="splitCount"
                  (onChange)="onSelectSplitValue($event.value)"
                  [options]="SplitPartsCountOptions"></p-dropdown>
    </div>
  </ng-container>

  <ng-container page-content>
    <div class="list-search-wrapper">

      <div class="list-search-block">
        <p-dropdown
          [formControl]="selectedBook"
          [options]="songBooksDict"
          optionLabel="title"
          styleClass="list-search-dropdown"
        >
          <ng-template pTemplate="selectedItem" let-data>{{ data.title }}</ng-template>
        </p-dropdown>

        <lyri-list-box [items]="(songsList$ | async) || []" [formControl]="songControl" [tabIndex]="0">
          <ng-template [pTemplate]="ListBoxTemplates.ITEM" let-data let-search="search">
            <div class="list-item__wrapper">
              <div class="list-item__number" [innerHTML]="data.searchKey  | highliter: search"></div>
              <div class="list-item__title" [innerHTML]="data.title | highliter: search"></div>
            </div>
          </ng-template>
        </lyri-list-box>
      </div>
    </div>

    @if (selectedSong$ | async; as song) {
      @if (song) {
        <lyri-song [song]="song" (selectLyricLine)="onSelectLyricLine($event)" [tabIndex]="1"></lyri-song>
      }

    }
  </ng-container>

  <ng-container page-sideibar-preview>
    <lyri-casting-preview></lyri-casting-preview>
  </ng-container>
  <ng-container page-sideibar-content>
    <button pButton (click)="onStartCasting()">транслировать</button>
    <button pButton (click)="onStartCasting(true)">Начать с выбранного слайда</button>
    <div class="flex">
      <button pButton severity="danger" (click)="onPauseCasting()">Остановить</button>
      <button pButton severity="danger" (click)="onCloseCasting()">Закрыть</button>
    </div>

    <div class="flex">
      <button pButton severity="help" (click)="onNavigateSlide('prev')">Назад</button>
      <button pButton severity="help" (click)="onNavigateSlide('next')">В перед</button>
    </div>
  </ng-container>
</lyri-page-container>
