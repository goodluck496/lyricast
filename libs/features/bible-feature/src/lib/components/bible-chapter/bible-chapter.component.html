<ng-scrollbar style="width: 100%; border-radius: 8px 8px 0 0;">
  @for (section of sections(); track section.heading) {
    <div class="bible-chapter-section">
      @if (section.heading) {
        <div class="bible-chapter-section__header">
          {{ section.heading }}
        </div>
      }
      <div class="list-item__wrapper bible-chapter-section__content">
        @for (verse of section.content; track verse.number) {
          @if (verse.number === 1) {
            <div
              tourAnchor="bible:verse"
              #verseItem class="bible-chapter-section__verse list-item"
              [class.bible-chapter-section__verse--selected]="selectedVerse()?.number === verse.number"
              [class.bible-chapter-section__verse--in-range]="isInRange(verse.number)"
              (dblclick)="onSelectVerse(verse, $event, true)"
              (click)="onSelectVerse(verse, $event)">
              <div class="bible-chapter-section__verse-number">
                <div class="list-item__number">{{ verse.number }}</div>
              </div>
              <div class="list-item__title bible-chapter-section__verse-content"
                   [innerHTML]="sanitizeHtml(verse.text)"></div>

              <div class="bible-chapter-section__shift-badge" tourAnchor="bible:shift">
                + shift
              </div>
            </div>
          } @else {
            <div #verseItem class="bible-chapter-section__verse list-item"
                 [class.bible-chapter-section__verse--selected]="selectedVerse()?.number === verse.number"
                 [class.bible-chapter-section__verse--in-range]="isInRange(verse.number)"
                 (dblclick)="onSelectVerse(verse, $event, true)"
                 (click)="onSelectVerse(verse, $event)">
              <div class="bible-chapter-section__verse-number">
                <div class="list-item__number">{{ verse.number }}</div>
              </div>
              <div class="list-item__title bible-chapter-section__verse-content"
                   [innerHTML]="sanitizeHtml(verse.text)"></div>

              <div class="bible-chapter-section__shift-badge">
                + shift
              </div>
            </div>
          }
        }
      </div>
    </div>
  }
</ng-scrollbar>
