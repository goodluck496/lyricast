<div class="auth-backdrop" *ngIf="isVisible$ | async">
  <div class="auth-dialog">
    <div class="auth-dialog__header">
      <div class="auth-dialog__icon">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 1 1 6 0v3H9V7z" fill="currentColor"/>
        </svg>
      </div>
      <h2>Вход в LyriCast</h2>
      <p class="auth-dialog__subtitle">
        Для работы со справочниками песен и Библии войдите через Google.
      </p>
    </div>

    @if (error$ | async; as err) {
      <div class="auth-dialog__alert">
        <span class="auth-dialog__alert-icon">⚠️</span>
        <span class="auth-dialog__alert-text">{{ err }}</span>
      </div>
    }

    @if (isLoading$ | async) {
      <div class="auth-dialog__loading">
        <div class="auth-spinner"></div>
        <p>Ожидание завершения авторизации в браузере...</p>
      </div>
    }

    <div class="auth-dialog__actions">
      <button
        type="button"
        class="auth-btn-google"
        [disabled]="isLoading$ | async"
        (click)="loginWithGoogle()"
      >
        <svg class="google-svg" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Войти через Google</span>
      </button>

      <button
        type="button"
        class="auth-btn-cancel"
        [disabled]="isLoading$ | async"
        (click)="onCancel()"
      >
        Отмена
      </button>
    </div>
  </div>
</div>
